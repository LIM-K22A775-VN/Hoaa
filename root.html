<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoaaa Hậuuu - Nhật Ký Kỷ Niệm</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fff0f5;
            --text-main: #4a4a4a;
            --primary-pink: #d87093;
            --light-pink: #ffe4e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Hiệu ứng hoa bay nền */
        .flower-float {
            position: fixed;
            font-size: 24px;
            user-select: none;
            z-index: 0;
            pointer-events: none;
            animation: floatAround linear infinite;
            opacity: 0.6;
        }

        @keyframes floatAround {
            0% { transform: translateY(110vh) translateX(0) rotate(0deg); }
            50% { transform: translateY(50vh) translateX(50px) rotate(180deg); }
            100% { transform: translateY(-10vh) translateX(-30px) rotate(360deg); }
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: var(--primary-pink);
            text-shadow: 2px 2px 4px rgba(255,182,193,0.6);
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.05rem;
            color: #666;
            font-weight: 500;
        }

        /* Khu vực các nút bấm điều hướng (Menu các ô) */
        .menu-container {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 600px;
            width: 100%;
        }

        @media (max-width: 550px) {
            .menu-container {
                grid-template-columns: 1fr;
            }
        }

        .menu-card {
            background: white;
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: 0 8px 25px rgba(216, 112, 147, 0.15);
            border: 2px solid #ffd1dc;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            background-color: var(--light-pink);
            border-color: var(--primary-pink);
            box-shadow: 0 12px 30px rgba(216, 112, 147, 0.25);
        }

        .menu-icon {
            font-size: 2.5rem;
        }

        .menu-title {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: var(--primary-pink);
            font-weight: 700;
        }

        .menu-desc {
            font-size: 0.85rem;
            color: #777;
        }

        footer {
            margin-top: 40px;
            position: relative;
            z-index: 10;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <!-- Hiệu ứng hoa bay -->
    <script>
        const flowers = ['🌷', '🌸', '🌹', '🌺', '🌻', '💮'];
        for (let i = 0; i < 20; i++) {
            const div = document.createElement('div');
            div.className = 'flower-float';
            div.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];
            div.style.left = Math.random() * 100 + 'vw';
            div.style.animationDuration = (Math.random() * 8 + 6) + 's';
            div.style.animationDelay = (Math.random() * 5) + 's';
            div.style.fontSize = (Math.random() * 12 + 15) + 'px';
            document.body.appendChild(div);
        }
    </script>

    <header>
        <h1>Tâm & Hoa 🌷</h1>
        <p>Góc nhỏ lưu giữ kỷ niệm của chúng mình</p>
    </header>

    <!-- Các ô điều hướng -->
    <div class="menu-container">
        <!-- Ô 1: Cuộc trò chuyện -->
        <a href="chat.html" class="menu-card">
            <div class="menu-icon">💬</div>
            <div class="menu-title">Cuộc Trò Chuyện</div>
            <div class="menu-desc">Xem lại nhật ký tin nhắn & trò chuyện</div>
        </a>

        <!-- Ô 2: Chia sẻ hằng ngày -->
        <a href="daily.html" class="menu-card">
            <div class="menu-icon">📅</div>
            <div class="menu-title">Chia Sẻ Hằng Ngày</div>
            <div class="menu-desc">Cập nhật chuyện vui buồn mỗi ngày</div>
        </a>

        <!-- Ô 3: Lời nhắn nhủ -->
        <a href="notes.html" class="menu-card">
            <div class="menu-icon">💌</div>
            <div class="menu-title">Lời Nhắn Nhủ</div>
            <div class="menu-desc">Gửi gắm lời chúc và sự dặn dò</div>
        </a>

        <!-- Ô 4: Hình ảnh kỷ niệm -->
        <a href="photos.html" class="menu-card">
            <div class="menu-icon">🖼️</div>
            <div class="menu-title">Hình Ảnh Kỷ Niệm</div>
            <div class="menu-desc">Album ảnh xòe quạt của Hoa Hậu</div>
        </a>
    </div>

    <footer>
        Made with 💖 by Tâm & Hoa
    </footer>

</body>
</html>
