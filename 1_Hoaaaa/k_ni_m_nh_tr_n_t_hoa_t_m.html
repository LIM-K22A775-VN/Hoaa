<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỷ Niệm Nhỏ - Trần T. Hoa & Tâm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ffe6f0 0%, #ffcce6 50%, #ffb3d9 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .script-font {
            font-family: 'Dancing Script', cursive;
        }
        @keyframes floatDown {
            0% {
                transform: translateY(-50px);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(105vh);
                opacity: 0;
            }
        }
        .falling-message {
            position: absolute;
            animation: floatDown linear infinite;
            white-space: nowrap;
            pointer-events: none;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 105, 180, 0.6)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(255, 20, 147, 0.8)); }
        }
        .pulse-heart {
            animation: pulseGlow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="relative flex flex-col items-center justify-between min-h-screen text-gray-800 p-4 overflow-x-hidden">

    <div id="falling-container" class="absolute inset-0 overflow-hidden pointer-events-none z-0"></div>

    <header class="z-10 text-center mt-6 mb-4 px-4 bg-white/60 backdrop-blur-md rounded-2xl p-6 shadow-lg max-w-lg w-full border border-pink-200">
        <h1 class="script-font text-4xl sm:text-5xl text-pink-600 font-bold mb-2">Trần T. Hoa & Tâm</h1>
        <p class="text-sm sm:text-base text-pink-700 font-medium">"Tớ make tone hồng cho Tâm đấyyy 🌷"</p>
    </header>

    <main class="z-10 flex flex-col items-center justify-center flex-grow w-full max-w-md my-4">
        <div class="bg-white/80 backdrop-blur-lg rounded-3xl p-6 sm:p-8 shadow-xl border border-pink-100 w-full text-center relative transition-all duration-300 hover:shadow-2xl">
            
            <div class="absolute -top-6 left-1/2 transform -translate-x-1/2 pulse-heart text-5xl">
                🌷
            </div>

            <div id="memory-display" class="min-h-[120px] flex flex-col justify-center items-center mt-4">
                <span class="text-xs uppercase tracking-widest text-pink-400 font-bold mb-2">Kỷ Niệm Ngọt Ngào</span>
                <p id="memory-text" class="text-base sm:text-lg text-gray-700 font-semibold italic px-2">
                    "Thật sự, nếu cứ tiếp diễn như này, có lẽ tớ sẽ không kìm lòng mà thích cậu mất thôi..."
                </p>
            </div>

            <div class="mt-6 flex flex-wrap gap-3 justify-center">
                <button onclick="nextMemory()" class="bg-gradient-to-r from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 text-white font-bold py-2.5 px-6 rounded-full shadow-md transform hover:-translate-y-0.5 transition-all text-sm flex items-center gap-2">
                    <span>💌</span> Xem Kỷ Niệm Khác
                </button>
                <button onclick="triggerHeartBurst()" class="bg-white hover:bg-pink-50 text-pink-500 border border-pink-300 font-bold py-2.5 px-5 rounded-full shadow-sm transform hover:-translate-y-0.5 transition-all text-sm flex items-center gap-2">
                    <span>✨</span> Thả Tim
                </button>
            </div>
        </div>
    </main>

    <footer class="z-10 text-center py-4 text-xs text-pink-800 font-medium bg-white/40 backdrop-blur-sm w-full rounded-xl mt-4">
        Cố trụ đến lúc toi quay lại đii • Made with 💖 for Tâm & Hoa
    </footer>

    <script>
        const memories = [
            "\"Thật sự, nếu cứ tiếp diễn như này, có lẽ tớ sẽ không kìm lòng mà thích cậu mất thôi...\"",
            "\"Tớ make tone hồng cho Tâm đấyyy 🌷\"",
            "\"Nào đến sn đứa nào cũng thế chỉ có đi ăn xong đi hát...\"",
            "\"Tớ từ nhỏ luôn có ý định thích người cùng quê, tớ ghét phải xa địa lý...\"",
            "\"Tâm của ngày xưa là phải lưu giữ kỉ niệm sau này già còn xem lại\"",
            "\"Nói Xinh nhiều nó sẽ tự xinh đấy - bà này khun phết!\"",
            "\"Mục tiêu gặp lại Hoa sẽ là Tâmm h4 🌸\"",
            "\"Đi thoiiii bạn mình mà ngại cgiii ✨\""
        ];

        let currentIndex = 0;

        function nextMemory() {
            const textElement = document.getElementById('memory-text');
            textElement.style.opacity = 0;
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % memories.length;
                textElement.innerText = memories[currentIndex];
                textElement.style.opacity = 1;
            }, 200);
        }

        // Smooth fade effect on text load
        document.getElementById('memory-text').style.transition = 'opacity 0.3s ease-in-out';

        const floatingSnippets = [
            "🌷 Tốt tính còn thông minh xinh nữa",
            "✨ Mỏ hỗn:3",
            "💖 Sợ lắm 🙉",
            "🌸 Nhả vía nhả vía",
            "🌷 Tớ dễ thương mà có lgi đâu",
            "✨ Hoa hậu mà sợ béo",
            "💖 Cầm mic sẽ tự tin hơn",
            "🌷 Tâm đừng đi tu đã nhá"
        ];

        function createFallingSnippet() {
            const container = document.getElementById('falling-container');
            const el = document.createElement('div');
            el.className = 'falling-message bg-white/70 backdrop-blur-sm text-pink-600 px-3 py-1.5 rounded-full text-xs font-semibold shadow-sm border border-pink-200';
            el.innerText = floatingSnippets[Math.floor(Math.random() * floatingSnippets.length)];
            
            const randomX = Math.random() * 90; // percentage width
            const duration = 8 + Math.random() * 7; // 8 to 15 seconds
            const fontSize = 0.8 + Math.random() * 0.3;

            el.style.left = randomX + 'vw';
            el.style.animationDuration = duration + 's';
            el.style.fontSize = fontSize + 'rem';

            container.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, duration * 1000);
        }

        // Spawn falling items periodically
        setInterval(createFallingSnippet, 1800);

        // Initial burst
        for(let i=0; i<4; i++) {
            setTimeout(createFallingSnippet, i * 400);
        }

        function triggerHeartBurst() {
            for(let i=0; i<8; i++) {
                setTimeout(() => {
                    const container = document.getElementById('falling-container');
                    const heart = document.createElement('div');
                    heart.className = 'falling-message text-xl';
                    heart.innerText = ['💖', '🌷', '✨', '🌸', '💕'][Math.floor(Math.random()*5)];
                    heart.style.left = (Math.random() * 80 + 10) + 'vw';
                    heart.style.animationDuration = (4 + Math.random() * 3) + 's';
                    container.appendChild(heart);
                    setTimeout(() => heart.remove(), 6000);
                }, i * 150);
            }
        }
    </script>
</body>
</html>
