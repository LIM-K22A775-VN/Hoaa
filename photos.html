<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Hoaaa 🌷</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #fff0f5;
        --text-main: #4a4a4a;
        --primary-pink: #d87093;
        --light-pink: #ffe4e1;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "Montserrat", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        padding: 15px;
      }

      /* Hiệu ứng hoa bay nền xuất hiện ngay lập tức và bay liên tục */
      .flower-float {
        position: fixed;
        font-size: 24px;
        user-select: none;
        z-index: 0;
        pointer-events: none;
        animation: floatInstant linear infinite;
        opacity: 0.6;
      }

      @keyframes floatInstant {
        0% {
          transform: translateY(105vh) translateX(0) rotate(0deg);
        }
        100% {
          transform: translateY(-10vh) translateX(30px) rotate(360deg);
        }
      }

      /* Hiệu ứng hoa bay ra từ đúng vị trí click (kể cả trên hình ảnh) */
      .burst-flower {
        position: fixed;
        font-size: 24px;
        z-index: 9999;
        pointer-events: none;
        animation: burstFromPoint 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      }

      @keyframes burstFromPoint {
        0% {
          transform: translate(0, 0) scale(0.3) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(540deg);
          opacity: 0;
        }
      }

      /* Nút quay lại trang chủ dạng icon dễ thương */
      .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        background: white;
        color: var(--primary-pink);
        border: 2px solid #ffd1dc;
        padding: 8px 18px;
        border-radius: 25px;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
        box-shadow: 0 4px 15px rgba(216, 112, 147, 0.15);
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .back-btn:hover {
        background: var(--light-pink);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(216, 112, 147, 0.25);
      }

      /* Tiêu đề phía trên khung */
      header {
        text-align: center;
        margin-bottom: 10px;
        position: relative;
        z-index: 10;
      }

      header h1 {
        font-family: "Dancing Script", cursive;
        font-size: 2.8rem;
        color: var(--primary-pink);
        text-shadow: 1px 1px 3px rgba(255, 182, 193, 0.5);
      }

      /* Khung lớn bọc ngoài phong cách ebook */
      .ebook-wrapper {
        background: white;
        width: 100%;
        max-width: 680px;
        height: 78vh;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(216, 112, 147, 0.15);
        border: 2px solid #ffd1dc;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 10;
        overflow: hidden;
      }

      /* Thanh công cụ phía trên khung */
      .ebook-toolbar {
        padding: 12px 20px;
        border-bottom: 1px solid #fce4ec;
        display: flex;
        align-items: center;
        background: #fff9fa;
      }

      .toolbar-badge {
        background: var(--light-pink);
        color: var(--primary-pink);
        padding: 6px 16px;
        border-radius: 15px;
        font-weight: 600;
        font-size: 0.95rem;
        border: 1px solid #ffb6c1;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* Khung chứa hiệu ứng xòe quạt ảnh */
      .content-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        position: relative;
      }

      .fan-container {
        position: relative;
        width: 100%;
        height: 350px;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
      }

      .fan-card {
        position: absolute;
        width: 210px;
        height: 280px;
        background: #fff;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        cursor: pointer;
        transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        padding: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform-origin: bottom center;
        border: 1px solid #fce4ec;
      }

      .fan-card img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 10px;
        image-rendering: -webkit-optimize-contrast;
        pointer-events: none; /* Giúp cú click xuyên qua ảnh để nhận diện vị trí bấm chính xác */
      }

      /* Nút điều hướng qua lại xòe quạt */
      .fan-nav {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 15px;
      }

      .fan-nav button {
        background: var(--primary-pink);
        color: white;
        border: none;
        padding: 8px 22px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        box-shadow: 0 4px 10px rgba(216, 112, 147, 0.3);
        transition:
          background 0.2s,
          transform 0.1s;
      }

      .fan-nav button:hover {
        background: #ff69b4;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <!-- Nút quay về trang chủ -->
    <a href="index.html" class="back-btn">🏠</a>

    <!-- Hiệu ứng hoa bay nền xuất hiện ngay lập tức, không chờ đợi -->
    <script>
      const backgroundFlowers = ["🌷", "🌸", "🌹", "🌺", "🌻", "💮"];
      for (let i = 0; i < 20; i++) {
        const div = document.createElement("div");
        div.className = "flower-float";
        div.innerHTML =
          backgroundFlowers[
            Math.floor(Math.random() * backgroundFlowers.length)
          ];
        div.style.left = Math.random() * 100 + "vw";
        div.style.top = Math.random() * 100 + "vh"; // Rải đều sẵn trên màn hình
        div.style.animationDuration = Math.random() * 4 + 5 + "s";
        div.style.animationDelay = "0s"; // Không có độ trễ, bay luôn
        div.style.fontSize = Math.random() * 10 + 14 + "px";
        document.body.appendChild(div);
      }
    </script>

    <header>
      <h1>Hoa 🌷</h1>
    </header>

    <!-- Khung ebook bọc ngoài -->
    <div class="ebook-wrapper">
      <div class="ebook-toolbar">
        <div class="toolbar-badge">🖼️Hoa Hậu 🌷🌷🌷</div>
      </div>

      <div class="content-area">
        <!-- Khu vực hiển thị xòe quạt 3D -->
        <div class="fan-container" id="fanContainer"></div>

        <!-- Nút bấm lướt ảnh -->
        <div class="fan-nav">
          <button onclick="slideCard(-1)">❮ Lùi</button>
          <button onclick="slideCard(1)">Tiếp ❯</button>
        </div>
      </div>
    </div>

    <script>
      // Hàm tạo hiệu ứng hoa bung nở tại điểm (x, y)
      function createFlowerBurst(x, y) {
        const burstSymbols = ["🌷", "🌸", "💖", "✨", "🌹", "🌻", "💮"];
        for (let i = 0; i < 18; i++) {
          const span = document.createElement("span");
          span.className = "burst-flower";
          span.innerHTML =
            burstSymbols[Math.floor(Math.random() * burstSymbols.length)];
          span.style.left = x + "px";
          span.style.top = y + "px";

          const angle = Math.random() * Math.PI * 2;
          const distance = Math.random() * 140 + 30;
          const dx = Math.cos(angle) * distance + "px";
          const dy = Math.sin(angle) * distance + "px";

          span.style.setProperty("--dx", dx);
          span.style.setProperty("--dy", dy);

          document.body.appendChild(span);

          setTimeout(() => {
            span.remove();
          }, 1000);
        }
      }

      // Lắng nghe sự kiện click trên toàn bộ trang (bao gồm cả khi bấm vào ảnh)
      document.addEventListener("click", function (event) {
        createFlowerBurst(event.clientX, event.clientY);
      });

      const fanContainer = document.getElementById("fanContainer");
      let cards = [];
      let currentIndex = 0;

      const imagesArray = [
        "1.jfif",
        "1.png",
        "2.jfif",
        "2.png",
        "3.jfif",
        "3.png",
        "4.jfif",
        "4.png",
        "5.jfif",
        "6.jfif",
        "6.png",
        "7.jfif",
        "7.png",
        "8.jfif",
        "8.png",
        "9.jfif",
        "9.png",
        "10.jfif",
        "10.png",
        "11.jfif",
        "13.jfif",
        "14.jfif",
        "15.jfif",
        "11.png",
        "12.jfif",
        "12.png",
        "13.png",
        "16.jfif",
        "17.jfif",
        "18.jfif",
        "19.jfif",
        "5.png",
      ];

      const totalPhotos = imagesArray.length;   

      imagesArray.forEach((filename, index) => {
        const card = document.createElement("div");
        card.className = "fan-card";
        card.innerHTML = `
                <img src="1_Hoaaaa/${filename}" alt="Memory ${index + 1}" onerror="this.src='https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=300'">
            `;
        card.onclick = (e) => {
          // Vừa đổi ảnh vừa bắn hoa tại chỗ bấm vào ảnh
          currentIndex = index;
          updateFanPositions();
        };
        fanContainer.appendChild(card);
      });

      cards = document.querySelectorAll(".fan-card");

      function updateFanPositions() {
        if (cards.length === 0) return;

        cards.forEach((card, index) => {
          let offset = index - currentIndex;

          if (Math.abs(offset) <= 4) {
            card.style.display = "flex";
            let rotateAngle = offset * 12;
            let translateX = offset * 45;
            let opacity = 1 - Math.abs(offset) * 0.18;

            if (offset === 0) {
              card.style.transform = `translateX(0px) translateY(-15px) rotate(0deg) scale(1.08)`;
              card.style.zIndex = "10";
              card.style.opacity = "1";
              card.style.boxShadow = "0 15px 35px rgba(216, 112, 147, 0.35)";
            } else {
              card.style.transform = `translateX(${translateX}px) translateY(${Math.abs(offset) * 8}px) rotate(${rotateAngle}deg) scale(0.92)`;
              card.style.zIndex = 10 - Math.abs(offset);
              card.style.opacity = `${opacity}`;
              card.style.boxShadow = "0 8px 20px rgba(0,0,0,0.12)";
            }
          } else {
            card.style.display = "none";
          }
        });
      }

      function slideCard(direction) {
        if (totalPhotos === 0) return;
        currentIndex += direction;
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= totalPhotos) currentIndex = totalPhotos - 1;
        updateFanPositions();
      }

      updateFanPositions();
    </script>
  </body>
</html>
