    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fff0f5;
            --text-main: #4a4a4a;
            --primary-pink: #d87093;
            --light-pink: #ffe4e1;
            --light-purple: #e6e6fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 15px;
        }

        /* Hiệu ứng hoa bay nền */
        .flower-float {
            position: fixed;
            font-size: 24px;
            user-select: none;
            z-index: 0;
            pointer-events: none;
            animation: floatAround linear infinite;
            opacity: 0.6;
        }

        @keyframes floatAround {
            0% { transform: translateY(110vh) translateX(0) rotate(0deg); }
            50% { transform: translateY(50vh) translateX(50px) rotate(180deg); }
            100% { transform: translateY(-10vh) translateX(-30px) rotate(360deg); }
        }

        /* Nút quay lại trang chủ dạng viên thuốc dễ thương */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            color: var(--primary-pink);
            border: 2px solid #ffd1dc;
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(216, 112, 147, 0.15);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--light-pink);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(216, 112, 147, 0.25);
        }

        /* Tiêu đề phía trên khung */
        header {
            text-align: center;
            margin-bottom: 10px;
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: var(--primary-pink);
            text-shadow: 1px 1px 3px rgba(255,182,193,0.5);
        }

        /* Khung lớn bọc ngoài */
        .ebook-wrapper {
            background: white;
            width: 100%;
            max-width: 680px;
            height: 78vh;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(216, 112, 147, 0.15);
            border: 2px solid #ffd1dc;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        /* Thanh công cụ phía trên khung */
        .ebook-toolbar {
            padding: 12px 20px;
            border-bottom: 1px solid #fce4ec;
            display: flex;
            align-items: center;
            background: #fff9fa;
        }

        .toolbar-badge {
            background: var(--light-pink);
            color: var(--primary-pink);
            padding: 6px 16px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid #ffb6c1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Khung chứa đoạn chat có thanh cuộn riêng */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            -webkit-overflow-scrolling: touch;
        }

        /* Tùy chỉnh thanh cuộn xinh xắn */
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: #ffb6c1;
            border-radius: 10px;
        }
        .chat-container::-webkit-scrollbar-thumb:hover {
            background: var(--primary-pink);
        }

        .chat-bubble {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            box-shadow: 0 3px 10px rgba(0,0,0,0.03);
            word-wrap: break-word;
            position: relative;
        }

        .chat-bubble.tam {
            background-color: var(--light-pink);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            border: 1px solid #ffb6c1;
        }

            background-color: var(--light-purple);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #d8bfd8;
        }

        .sender-name {
            font-size: 0.75rem;
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
            opacity: 0.7;
        }
    </style>
</head>
