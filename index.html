<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hoaaa Hậuuu - Nhật Ký Kỷ Niệm</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fff0f5;
            --text-main: #4a4a4a;
            --primary-pink: #d87093;
            --light-pink: #ffe4e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* Hiệu ứng hoa bay nền xuất hiện ngay lập tức và bay liên tục */
        .flower-float {
            position: fixed;
            font-size: 24px;
            user-select: none;
            z-index: 0;
            pointer-events: none;
            animation: floatInstant linear infinite;
            opacity: 0.6;
        }

        @keyframes floatInstant {
            0% { transform: translateY(105vh) translateX(0) rotate(0deg); }
            100% { transform: translateY(-10vh) translateX(30px) rotate(360deg); }
        }

        /* Hiệu ứng hoa bung nở khi click */
        .burst-flower {
            position: fixed;
            font-size: 24px;
            z-index: 9999;
            pointer-events: none;
            animation: burstFromPoint 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes burstFromPoint {
            0% {
                transform: translate(0, 0) scale(0.3) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(540deg);
                opacity: 0;
            }
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: var(--primary-pink);
            text-shadow: 2px 2px 4px rgba(255,182,193,0.6);
            margin-bottom: 8px;
        }

        header p {
            font-size: 1.05rem;
            color: #666;
            font-weight: 500;
        }

        /* Menu các ô (3 ô gọn gàng) */
        .menu-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 450px;
            width: 100%;
        }

        .menu-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: 0 8px 25px rgba(216, 112, 147, 0.15);
            border: 2px solid #ffd1dc;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            background-color: var(--light-pink);
            border-color: var(--primary-pink);
            box-shadow: 0 12px 30px rgba(216, 112, 147, 0.25);
        }

        .menu-icon {
            font-size: 2.3rem;
            min-width: 50px;
        }

        .menu-text {
            text-align: left;
        }

        .menu-title {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: var(--primary-pink);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .menu-desc {
            font-size: 0.85rem;
            color: #777;
        }

        footer {
            margin-top: 30px;
            position: relative;
            z-index: 10;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <!-- Hiệu ứng hoa bay xuất hiện ngay lập tức, không chờ đợi -->
    <script>
        const backgroundFlowers = ['🌷', '🌸', '🌹', '🌺', '🌻', '💮'];
        for (let i = 0; i < 20; i++) {
            const div = document.createElement('div');
            div.className = 'flower-float';
            div.innerHTML = backgroundFlowers[Math.floor(Math.random() * backgroundFlowers.length)];
            div.style.left = Math.random() * 100 + 'vw';
            div.style.top = Math.random() * 100 + 'vh'; // Rải đều vị trí ngay khi load
            div.style.animationDuration = (Math.random() * 4 + 5) + 's';
            div.style.animationDelay = '0s'; // Không có độ trễ
            div.style.fontSize = (Math.random() * 10 + 14) + 'px';
            document.body.appendChild(div);
        }

        // Hiệu ứng hoa bung nở khi click vào màn hình
        function createFlowerBurst(x, y) {
            const burstSymbols = ['🌷', '🌸', '💖', '✨', '🌹', '🌻', '💮'];
            for (let i = 0; i < 18; i++) {
                const span = document.createElement('span');
                span.className = 'burst-flower';
                span.innerHTML = burstSymbols[Math.floor(Math.random() * burstSymbols.length)];
                span.style.left = x + 'px';
                span.style.top = y + 'px';

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 140 + 30;
                const dx = Math.cos(angle) * distance + 'px';
                const dy = Math.sin(angle) * distance + 'px';

                span.style.setProperty('--dx', dx);
                span.style.setProperty('--dy', dy);

                document.body.appendChild(span);

                setTimeout(() => {
                    span.remove();
                }, 1000);
            }
        }

        document.addEventListener('click', function(event) {
            createFlowerBurst(event.clientX, event.clientY);
        });
    </script>

    <header>
        <h1>Hoaaa Hậuuu 🌷</h1>
        <p>Góc nhỏ kỷ niệm của Hoaa & Tâm</p>
    </header>

    <div class="menu-container">
        <!-- Ô 1: Cuộc trò chuyện -->
        <a href="chat.html" class="menu-card">
            <div class="menu-icon">💬</div>
            <div class="menu-text">
                <div class="menu-title">Cuộc Trò Chuyện</div>
                <div class="menu-desc">Nhật ký tin nhắn </div>
            </div>
        </a>

        <!-- Ô 2: Lời Nhắn Nhủ -->
        <a href="notes.html" class="menu-card">
            <div class="menu-icon">📝</div>
            <div class="menu-text">
                <div class="menu-title">Lời Nhắn Nhủ - Tâm & Hoa</div>
                <div class="menu-desc">Góc nhỏ ghi lại những lời nhắn nhủ</div>
            </div>
        </a>

        <!-- Ô 3: Hình ảnh kỷ niệm -->
        <a href="photos.html" class="menu-card">
            <div class="menu-icon">🖼️</div>
            <div class="menu-text">
                <div class="menu-title">Hình Ảnh Kỷ Niệm</div>
                <div class="menu-desc">Album ảnh xinh xắn của Hoaa</div>
            </div>
        </a>
    </div>

    <footer>
        Made with 🌷 by Tâm & Hoaa
    </footer>

</body>
</html>
